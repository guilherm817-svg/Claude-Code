<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../vsl-player.css">
<style>body{margin:0;padding:16px;background:#111;color:#eee;font-family:system-ui} main{max-width:720px;margin:0 auto}</style>
</head><body><main>
<h1 style="font-size:20px">Página de teste</h1>
<div class="vsl-player" id="vsl-teste" data-src="teste.webm" data-pitch="5" data-resume-min="3" data-fullscreen="true" data-analytics="__ANALYTICS__" data-analytics-interval="5" data-autoplay="__AUTOPLAY__"></div>
<p id="aviso" data-vsl-hide-at="5">Aguarde a oferta...</p>
<div id="cta" data-vsl-show-at="5"><a href="#">COMPRAR</a></div>
<div class="vsl-player" id="vsl-segundo" data-src="teste.webm" data-autoplay="false" data-resume="false"></div>
<p id="cta2" data-vsl-show-at="2" data-vsl-player="vsl-segundo">Elemento do segundo player</p>
<pre id="log"></pre>
</main>
<script src="../vsl-player.js"></script>
<script>
  window.eventos = [];
  VSLPlayer.on('*', (d, nome) => { if (nome !== 'progress') window.eventos.push({ nome, id: d.id, detail: Object.fromEntries(Object.entries(d).filter(([k,v]) => typeof v !== 'object')) }); });
</script>
</body></html>
